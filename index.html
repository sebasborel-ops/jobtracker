<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTracker Pro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📋 JobTracker Pro</h1>
    <p>Gestionnaire professionnel de candidatures</p>
</header>

<div class="container">

    <div class="stats">

        <div class="stat-card">
            <h3>Total</h3>
            <div id="total" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <h3>Entretiens</h3>
            <div id="entretiens" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <h3>Offres</h3>
            <div id="offres" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <h3>Taux entretien</h3>
            <div id="taux" class="stat-value">0%</div>
        </div>

    </div>

    <div class="search">
        <input
            id="search"
            type="text"
            placeholder="🔍 Rechercher une entreprise ou un poste">
    </div>

    <div class="toolbar">

        <input
            id="company"
            placeholder="Entreprise">

        <input
            id="position"
            placeholder="Poste">

        <select id="priority">
            <option>Faible</option>
            <option selected>Moyenne</option>
            <option>Haute</option>
        </select>

        <button
            class="btn"
            onclick="createJob()">
            Ajouter
        </button>

    </div>

    <div class="toolbar">

        <input
            id="recruiter"
            placeholder="Nom du recruteur">

        <input
            id="email"
            placeholder="Email recruteur">

        <input
            id="salary"
            placeholder="Salaire">

        <input
            id="followup"
            type="date">

    </div>

    <div style="margin-bottom:20px">

        <textarea
            id="notes"
            placeholder="Notes d'entretien, commentaires, suivi..."></textarea>

    </div>

    <div class="actions-bar">

        <button
            class="btn"
            onclick="exportData()">

            📥 Export JSON

        </button>

        <label class="btn">

            📤 Import JSON

            <input
                id="importFile"
                type="file"
                accept=".json"
                hidden>

        </label>

        <button
            class="btn"
            onclick="toggleDarkMode()">

            🌙 Mode sombre

        </button>

    </div>

    <div class="board">

        <div class="column">
            <h2>À envoyer</h2>
            <div id="col0"></div>
        </div>

        <div class="column">
            <h2>Envoyée</h2>
            <div id="col1"></div>
        </div>

        <div class="column">
            <h2>Entretien</h2>
            <div id="col2"></div>
        </div>

        <div class="column">
            <h2>Offre</h2>
            <div id="col3"></div>
        </div>

        <div class="column">
            <h2>Refus</h2>
            <div id="col4"></div>
        </div>

    </div>

</div>

<script src="app.js"></script>

<script>

function createJob() {

    addJob({

        company:
            document.getElementById("company").value,

        position:
            document.getElementById("position").value,

        recruiter:
            document.getElementById("recruiter").value,

        email:
            document.getElementById("email").value,

        salary:
            document.getElementById("salary").value,

        followup:
            document.getElementById("followup").value,

        priority:
            document.getElementById("priority").value,

        notes:
            document.getElementById("notes").value

    });

    location.reload();
}

function toggleDarkMode() {

    document.body
        .classList
        .toggle("dark");

}

document
.getElementById("importFile")
.addEventListener(
    "change",
    e => importData(e.target.files[0])
);

</script>

</body>

</html>
